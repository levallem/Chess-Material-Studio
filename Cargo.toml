[package]
name = "chess-material-studio"
version = "2.5.2"
authors = ["brianch <brianch@users.noreply.github.com>"]
edition = "2024"

[dependencies]
iced = { version = "0.14", default-features = false, features = ["svg", "tokio", "lazy", "advanced", "advanced-shaping"] }
iced_aw = { version = "0.14.1", default-features = false, features = ["tabs"] }
#iced_drop = {git = "https://github.com/pml68/iced_drop.git", branch="0.14"}
iced_drop = { version = "0.2.42", features = ["helpers"] }

rand = "0.10.2"
chrono = "0.4.45"
chess = "3.2.0"
csv = "1.4.0"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process", "io-std", "io-util", "sync"] }
reqwest = "0.13.4"
zstd = "0.13.3"
rodio = { version = "0.22.2",  default-features = false, features = ["playback", "symphonia-all"] }
fluent-bundle = "0.16.0"
intl-memoizer = "0.5.3"
unic-langid = { version = "0.9.6", features = ["macros"] }
diesel = { version = "2.3.12", features = ["sqlite"] }
diesel_migrations = "2.3.2"
lopdf = { git="https://github.com/J-F-Liu/lopdf.git", rev="ed42c15d297c8bf55240502222d7273cffb41392", features = ["font_embedding"] }

open = "5.4.1"
#rfd = { version = "0.13.0", default-features = false, features = ["xdg-portal", "tokio"] }
rfd = "0.17.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
libsqlite3-sys = { version = "0.38.1", features = ["bundled"] }
