name: Cargo Build

on:
  push:
    branches: [ "main" ]
    paths-ignore: 'README.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore: 'README.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    runs-on: ubuntu-latest

    name: Test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libasound2-dev libgtk-3-dev libsqlite3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --locked

  quality:

    runs-on: ubuntu-latest

    name: Quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libasound2-dev libgtk-3-dev libsqlite3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo check --locked --all-targets

  build-linux:

    needs: [test, quality]
    runs-on: ubuntu-latest

    name: Build Linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libasound2-dev libgtk-3-dev libsqlite3-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release --verbose
      - name: Prepare directory to upload as an artifact
        run: |
          mkdir zip
          mkdir zip/chess-material-studio
          cp -R pieces zip/chess-material-studio/
          cp -R puzzles zip/chess-material-studio/
          cp -R translations zip/chess-material-studio/
          cp -R font zip/chess-material-studio/
          cp THIRD_PARTY_NOTICES.md zip/chess-material-studio/
          cp LICENSE zip/chess-material-studio/
          cp README.md zip/chess-material-studio/
          cp target/release/chess-material-studio zip/chess-material-studio/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-bin
          path: zip/
          include-hidden-files: true

  build-mac:

    needs: [test, quality]
    runs-on: macos-latest

    name: Build mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --locked --release --verbose
      - name: Prepare directory to upload as an artifact
        run: |
          mkdir zip
          mkdir zip/chess-material-studio
          cp -R pieces zip/chess-material-studio/
          cp -R puzzles zip/chess-material-studio/
          cp -R translations zip/chess-material-studio/
          cp -R font zip/chess-material-studio/
          cp THIRD_PARTY_NOTICES.md zip/chess-material-studio/
          cp LICENSE zip/chess-material-studio/
          cp README.md zip/chess-material-studio/
          cp target/release/chess-material-studio zip/chess-material-studio/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release-bin
          path: zip/
          include-hidden-files: true

  build-windows-64:

    needs: [test, quality]
    runs-on: windows-latest

    name: Build Windows 64-bit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Enable static CRT linkage
        run: |
          mkdir .cargo
          echo '[target.x86_64-pc-windows-msvc]' >> .cargo/config
          echo 'rustflags = ["-Ctarget-feature=+crt-static"]' >> .cargo/config
      - run: cargo build --locked --release --verbose
      - name: Prepare directory to upload as an artifact
        run: |
          mkdir zip
          mkdir zip/chess-material-studio
          cp -R pieces zip/chess-material-studio/
          cp -R puzzles zip/chess-material-studio/
          cp -R translations zip/chess-material-studio/
          cp -R font zip/chess-material-studio/
          cp THIRD_PARTY_NOTICES.md zip/chess-material-studio/
          cp LICENSE zip/chess-material-studio/
          cp README.md zip/chess-material-studio/
          cp target/release/chess-material-studio.exe zip/chess-material-studio/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release
          path: zip/
          include-hidden-files: true

  build-windows-32:

    needs: [test, quality]
    runs-on: windows-latest

    name: Build Windows 32-bit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install i686 target
        run: rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Enable static CRT linkage
        run: |
          mkdir .cargo
          echo '[target.i686-pc-windows-msvc]' >> .cargo/config
          echo 'rustflags = ["-Ctarget-feature=+crt-static"]' >> .cargo/config
      - run: cargo build --locked --release --target i686-pc-windows-msvc --verbose
      - name: Prepare directory to upload as an artifact
        run: |
          mkdir zip
          mkdir zip/chess-material-studio
          cp -R pieces zip/chess-material-studio/
          cp -R puzzles zip/chess-material-studio/
          cp -R translations zip/chess-material-studio/
          cp -R font zip/chess-material-studio/
          cp THIRD_PARTY_NOTICES.md zip/chess-material-studio/
          cp LICENSE zip/chess-material-studio/
          cp README.md zip/chess-material-studio/
          cp target/i686-pc-windows-msvc/release/chess-material-studio.exe zip/chess-material-studio/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-i686
          path: zip/
          include-hidden-files: true

